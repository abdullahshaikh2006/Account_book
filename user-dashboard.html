<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউজার ডেসবোর্ড - হিসাবের খাতা</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== একেবারে মিনিমালিস্টিক ডিজাইন ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .dashboard-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
        }
        .dashboard-logo {
            font-size: 48px;
            color: #6366f1;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .menu-item {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px 16px;
            transition: 0.3s ease;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            text-decoration: none;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .menu-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-color: #6366f1;
        }
        .menu-item i {
            font-size: 28px;
            color: #6366f1;
        }
        .menu-item span {
            font-weight: 600;
            font-size: 15px;
        }
        .logout-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }
        @media (max-width: 480px) {
            .dashboard-container { padding: 30px 20px; }
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="dashboard-logo"><i class="fas fa-store-alt"></i></div>
        <h1>হিসাবের খাতা</h1>
        <p class="subtitle">আপনার ব্যবসার সব হিসাব এক জায়গায়</p>

        <!-- ===== মেনু লিংক ===== -->
        <div class="menu-grid">
            <a class="menu-item" href="purchases.html">
                <i class="fas fa-shopping-cart"></i>
                <span>ক্রয়</span>
            </a>
            <a class="menu-item" href="sales.html">
                <i class="fas fa-cash-register"></i>
                <span>বিক্রি</span>
            </a>
            <a class="menu-item" href="expenses.html">
                <i class="fas fa-receipt"></i>
                <span>খরচ</span>
            </a>
            <a class="menu-item" href="products.html">
                <i class="fas fa-boxes"></i>
                <span>পণ্য/স্টক</span>
            </a>
            <a class="menu-item" href="reports.html">
                <i class="fas fa-chart-pie"></i>
                <span>রিপোর্ট</span>
            </a>
            <a class="menu-item" href="profile.html">
                <i class="fas fa-user"></i>
                <span>প্রোফাইল</span>
            </a>
        </div>

        <!-- ===== লগআউট বাটন ===== -->
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> লগআউট
        </button>
    </div>

    <!-- ===== Firebase & Security Scripts ===== -->
    <script src="firebase-config.js"></script>
    <script>
        // 🔐 সিকিউরিটি চেক — লগইন করা না থাকলে লগইন পেজে পাঠাবে
        if (!auth.currentUser) {
            window.location.href = 'login.html';
        }

        // 🔐 লগআউট ফাংশন
        async function logout() {
            await auth.signOut();
            localStorage.removeItem('userData');
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
