<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - হিসাবের খাতা</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo {
            text-align: center;
            font-size: 50px;
            color: #667eea;
            margin-bottom: 10px;
        }
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s;
        }
        .form-group input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-primary { background: #6366f1; }
        .btn-primary:hover { background: #4f46e5; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .error-msg { color: #ef4444; text-align: center; margin-top: 10px; display: none; }
        .footer { text-align: center; margin-top: 20px; color: #64748b; }
        .footer a { color: #6366f1; text-decoration: none; font-weight: 600; }
        .footer a:hover { text-decoration: underline; }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { display: none; }
        @media (max-width: 480px) { .login-card { padding: 30px 20px; } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo"><i class="fas fa-store-alt"></i></div>
        <h2>লগইন করুন</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> ইমেইল</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> পাসওয়ার্ড</label>
                <input type="password" id="loginPassword" placeholder="********" required>
            </div>
            <div class="error-msg" id="loginError">ভুল ইমেইল বা পাসওয়ার্ড</div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> লগইন করুন</span>
            </button>
        </form>
        
        <div class="footer">
            অ্যাকাউন্ট নেই? <a href="register.html">রেজিস্টার করুন</a>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB16ZrdZ2IY_R8aSZipz-O6SelEblngJLE",
            authDomain: "marketing-calculation.firebaseapp.com",
            databaseURL: "https://marketing-calculation-default-rtdb.firebaseio.com",
            projectId: "marketing-calculation",
            storageBucket: "marketing-calculation.firebasestorage.app",
            messagingSenderId: "371475369216",
            appId: "1:371475369216:web:3aff3d68b707f65c1e77e5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('loginError');
            
            btn.classList.add('loading');
            btn.disabled = true;
            error.style.display = 'none';
            
            try {
                await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                const userCred = await auth.signInWithEmailAndPassword(email, password);
                const user = userCred.user;
                
                const snap = await database.ref('users/' + user.uid).once('value');
                const data = snap.val();
                if (!data) throw new Error('User data not found');
                
                localStorage.setItem('userData', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    name: data.name,
                    role: data.role || 'user'
                }));
                
                // Redirect based on role
                if (data.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
