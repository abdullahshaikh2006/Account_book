<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্টার - হিসাবের খাতা</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .register-logo {
            text-align: center;
            font-size: 50px;
            color: #10b981;
            margin-bottom: 10px;
        }
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s;
        }
        .form-group input:focus { border-color: #10b981; outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .error-msg { color: #ef4444; text-align: center; margin-top: 10px; display: none; }
        .footer { text-align: center; margin-top: 20px; color: #64748b; }
        .footer a { color: #6366f1; text-decoration: none; font-weight: 600; }
        .footer a:hover { text-decoration: underline; }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { display: none; }
        @media (max-width: 480px) { .register-card { padding: 30px 20px; } }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-logo"><i class="fas fa-user-plus"></i></div>
        <h2>রেজিস্টার করুন</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> নাম</label>
                <input type="text" id="regName" placeholder="আপনার নাম" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> ইমেইল</label>
                <input type="email" id="regEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> পাসওয়ার্ড</label>
                <input type="password" id="regPassword" placeholder="********" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-store"></i> ব্যবসার নাম</label>
                <input type="text" id="regBusiness" placeholder="আপনার ব্যবসার নাম">
            </div>
            <div class="error-msg" id="regError">রেজিস্টারে সমস্যা</div>
            <button type="submit" class="btn btn-success" id="regBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-user-plus"></i> রেজিস্টার করুন</span>
            </button>
        </form>
        
        <div class="footer">
            ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB16ZrdZ2IY_R8aSZipz-O6SelEblngJLE",
            authDomain: "marketing-calculation.firebaseapp.com",
            databaseURL: "https://marketing-calculation-default-rtdb.firebaseio.com",
            projectId: "marketing-calculation",
            storageBucket: "marketing-calculation.firebasestorage.app",
            messagingSenderId: "371475369216",
            appId: "1:371475369216:web:3aff3d68b707f65c1e77e5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const business = document.getElementById('regBusiness').value;
            const btn = document.getElementById('regBtn');
            const error = document.getElementById('regError');
            
            btn.classList.add('loading');
            btn.disabled = true;
            error.style.display = 'none';
            
            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCred.user;
                
                await database.ref('users/' + user.uid).set({
                    name,
                    email,
                    businessName: business || '',
                    role: 'user',
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });
                
                localStorage.setItem('userData', JSON.stringify({
                    uid: user.uid,
                    email,
                    name,
                    role: 'user'
                }));
                
                window.location.href = 'user-dashboard.html';
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
