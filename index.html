<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসাবের খাতা - লগইন</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite;
        }

        .bg-circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: 5s;
        }

        .bg-circle:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(0, -100px) scale(0.9); }
            75% { transform: translate(-50px, -50px) scale(1.05); }
        }

        /* Language Toggle */
        .lang-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-family: inherit;
            box-shadow: var(--shadow);
        }

        .lang-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* Auth Container */
        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 480px;
            margin: 20px;
            padding: 40px;
            animation: slideUp 0.6s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 36px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .auth-header h1 {
            font-size: 28px;
            color: var(--dark);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .auth-header p {
            color: var(--gray);
            font-size: 16px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            color: var(--gray);
            transition: var(--transition);
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
            font-family: inherit;
            background: #f8fafc;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-group input:focus + i,
        .input-group input:focus ~ i {
            color: var(--primary);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray);
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--gray);
        }

        .checkbox-label input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
        }

        .forgot-password:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-google {
            background: white;
            color: var(--dark);
            border: 2px solid var(--border);
        }

        .btn-google:hover {
            background: #f8fafc;
            border-color: var(--gray);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-google i {
            color: #ea4335;
        }

        .auth-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: var(--border);
        }

        .auth-divider::before { left: 0; }
        .auth-divider::after { right: 0; }

        .auth-divider span {
            background: white;
            padding: 0 10px;
            color: var(--gray);
            font-size: 14px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--gray);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Alert Messages */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid var(--success);
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid var(--danger);
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn.loading .spinner {
            display: inline-block;
        }

        .btn.loading .btn-text {
            display: none;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .auth-container {
                margin: 10px;
                padding: 30px 20px;
            }

            .auth-header h1 {
                font-size: 24px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 14px;
            }

            .form-options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <!-- Language Toggle -->
    <div class="lang-toggle">
        <button class="lang-btn" onclick="toggleLanguage()">
            <span class="lang-text">বাংলা</span> | <span class="lang-text">EN</span>
        </button>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <!-- Login Section -->
        <div id="loginSection">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-calculator"></i>
                </div>
                <h1 data-en="Accounting System" data-bn="হিসাবের খাতা">হিসাবের খাতা</h1>
                <p data-en="Sign in to your account" data-bn="আপনার অ্যাকাউন্টে সাইন ইন করুন">আপনার অ্যাকাউন্টে সাইন ইন করুন</p>
            </div>

            <div id="loginAlert" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label data-en="Email Address" data-bn="ইমেইল ঠিকানা">ইমেইল ঠিকানা</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="example@email.com" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Password" data-bn="পাসওয়ার্ড">পাসওয়ার্ড</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span data-en="Remember me" data-bn="আমাকে মনে রাখুন">আমাকে মনে রাখুন</span>
                    </label>
                    <a href="#" class="forgot-password" onclick="showForgotPassword()" data-en="Forgot Password?" data-bn="পাসওয়ার্ড ভুলে গেছেন?">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">
                        <i class="fas fa-sign-in-alt"></i>
                        <span data-en="Login" data-bn="লগইন">লগইন</span>
                    </span>
                </button>
                
                <div class="auth-divider">
                    <span data-en="or" data-bn="অথবা">অথবা</span>
                </div>
                
                <button type="button" class="btn btn-google" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i>
                    <span data-en="Sign in with Google" data-bn="Google দিয়ে লগইন">Google দিয়ে লগইন</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>
                    <span data-en="Don't have an account?" data-bn="অ্যাকাউন্ট নেই?">অ্যাকাউন্ট নেই?</span>
                    <a href="#" onclick="showRegister()" data-en="Register" data-bn="রেজিস্টার করুন">রেজিস্টার করুন</a>
                </p>
            </div>
        </div>

        <!-- Register Section -->
        <div id="registerSection" style="display: none;">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 data-en="Create Account" data-bn="নতুন অ্যাকাউন্ট">নতুন অ্যাকাউন্ট</h1>
                <p data-en="Register to get started" data-bn="রেজিস্টার করে শুরু করুন">রেজিস্টার করে শুরু করুন</p>
            </div>

            <div id="registerAlert" class="alert"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label data-en="Full Name" data-bn="সম্পূর্ণ নাম">সম্পূর্ণ নাম</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registerName" placeholder="আপনার নাম" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Business Name (Optional)" data-bn="ব্যবসার নাম (ঐচ্ছিক)">ব্যবসার নাম (ঐচ্ছিক)</label>
                    <div class="input-group">
                        <i class="fas fa-building"></i>
                        <input type="text" id="businessName" placeholder="ব্যবসার নাম">
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Mobile Number" data-bn="মোবাইল নম্বর">মোবাইল নম্বর</label>
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="mobileNumber" placeholder="01XXXXXXXXX" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Email Address" data-bn="ইমেইল ঠিকানা">ইমেইল ঠিকানা</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="registerEmail" placeholder="example@email.com" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Password" data-bn="পাসওয়ার্ড">পাসওয়ার্ড</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="কমপক্ষে ৬ অক্ষর" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Confirm Password" data-bn="পাসওয়ার্ড নিশ্চিত করুন">পাসওয়ার্ড নিশ্চিত করুন</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="পাসওয়ার্ড দিন" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="registerBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">
                        <i class="fas fa-user-plus"></i>
                        <span data-en="Register" data-bn="রেজিস্টার করুন">রেজিস্টার করুন</span>
                    </span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>
                    <span data-en="Already have an account?" data-bn="ইতিমধ্যে অ্যাকাউন্ট আছে?">ইতিমধ্যে অ্যাকাউন্ট আছে?</span>
                    <a href="#" onclick="showLogin()" data-en="Login" data-bn="লগইন করুন">লগইন করুন</a>
                </p>
            </div>
        </div>

        <!-- Forgot Password Section -->
        <div id="forgotPasswordSection" style="display: none;">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-key"></i>
                </div>
                <h1 data-en="Reset Password" data-bn="পাসওয়ার্ড রিসেট">পাসওয়ার্ড রিসেট</h1>
                <p data-en="Enter your email to receive reset link" data-bn="রিসেট লিংক পেতে ইমেইল দিন">রিসেট লিংক পেতে ইমেইল দিন</p>
            </div>

            <div id="forgotAlert" class="alert"></div>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label data-en="Email Address" data-bn="ইমেইল ঠিকানা">ইমেইল ঠিকানা</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="forgotEmail" placeholder="example@email.com" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i>
                    <span data-en="Send Reset Link" data-bn="রিসেট লিংক পাঠান">রিসেট লিংক পাঠান</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>
                    <a href="#" onclick="showLogin()" data-en="Back to Login" data-bn="লগইনে ফিরে যান">লগইনে ফিরে যান</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB16ZrdZ2IY_R8aSZipz-O6SelEblngJLE",
            authDomain: "marketing-calculation.firebaseapp.com",
            databaseURL: "https://marketing-calculation-default-rtdb.firebaseio.com",
            projectId: "marketing-calculation",
            storageBucket: "marketing-calculation.firebasestorage.app",
            messagingSenderId: "371475369216",
            appId: "1:371475369216:web:3aff3d68b707f65c1e77e5",
            measurementId: "G-79164G85DX"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentLanguage = 'bn';

        // Language Toggle
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'bn' ? 'en' : 'bn';
            updateLanguage();
        }

        function updateLanguage() {
            document.querySelectorAll('[data-en][data-bn]').forEach(element => {
                element.textContent = element.getAttribute(`data-${currentLanguage}`);
            });
        }

        // Show/Hide Sections
        function showLogin() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('forgotPasswordSection').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
            document.getElementById('forgotPasswordSection').style.display = 'none';
        }

        function showForgotPassword() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('forgotPasswordSection').style.display = 'block';
        }

        // Toggle Password Visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.password-toggle i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            const loginAlert = document.getElementById('loginAlert');
            
            // Show loading
            loginBtn.classList.add('loading');
            loginAlert.style.display = 'none';
            
            try {
                // Set persistence
                if (rememberMe) {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                } else {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
                }
                
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Check user role
                const userSnapshot = await database.ref('users/' + user.uid).once('value');
                const userData = userSnapshot.val();
                
                // Save to localStorage for offline
                localStorage.setItem('userData', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    name: userData?.name || user.email.split('@')[0],
                    role: userData?.role || 'user'
                }));
                
                // Redirect based on role
                if (userData?.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } catch (error) {
                console.error('Login error:', error);
                loginAlert.style.display = 'block';
                loginAlert.className = 'alert alert-error';
                loginAlert.textContent = error.message;
            } finally {
                loginBtn.classList.remove('loading');
            }
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const businessName = document.getElementById('businessName').value;
            const mobileNumber = document.getElementById('mobileNumber').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');
            const registerAlert = document.getElementById('registerAlert');
            
            // Validate passwords
            if (password !== confirmPassword) {
                registerAlert.style.display = 'block';
                registerAlert.className = 'alert alert-error';
                registerAlert.textContent = currentLanguage === 'bn' ? 
                    'পাসওয়ার্ড মিলছে না' : 'Passwords do not match';
                return;
            }
            
            if (password.length < 6) {
                registerAlert.style.display = 'block';
                registerAlert.className = 'alert alert-error';
                registerAlert.textContent = currentLanguage === 'bn' ? 
                    'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে' : 'Password must be at least 6 characters';
                return;
            }
            
            // Show loading
            registerBtn.classList.add('loading');
            registerAlert.style.display = 'none';
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Update user profile
                await user.updateProfile({
                    displayName: name
                });
                
                // Save user data to database
                await database.ref('users/' + user.uid).set({
                    name: name,
                    businessName: businessName || '',
                    mobileNumber: mobileNumber,
                    email: email,
                    role: 'user',
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    lastLogin: firebase.database.ServerValue.TIMESTAMP
                });
                
                // Save to localStorage
                localStorage.setItem('userData', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    name: name,
                    businessName: businessName,
                    mobileNumber: mobileNumber,
                    role: 'user'
                }));
                
                // Redirect to user dashboard
                window.location.href = 'user-dashboard.html';
            } catch (error) {
                console.error('Registration error:', error);
                registerAlert.style.display = 'block';
                registerAlert.className = 'alert alert-error';
                registerAlert.textContent = error.message;
            } finally {
                registerBtn.classList.remove('loading');
            }
        });

        // Forgot Password
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('forgotEmail').value;
            const forgotAlert = document.getElementById('forgotAlert');
            
            try {
                await auth.sendPasswordResetEmail(email);
                forgotAlert.style.display = 'block';
                forgotAlert.className = 'alert alert-success';
                forgotAlert.textContent = currentLanguage === 'bn' ? 
                    'পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে। আপনার ইমেইল চেক করুন।' : 
                    'Password reset link sent. Check your email.';
            } catch (error) {
                console.error('Forgot password error:', error);
                forgotAlert.style.display = 'block';
                forgotAlert.className = 'alert alert-error';
                forgotAlert.textContent = error.message;
            }
        });

        // Google Login
        async function loginWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Check if user exists in database
                const userSnapshot = await database.ref('users/' + user.uid).once('value');
                
                if (!userSnapshot.exists()) {
                    // Create new user
                    await database.ref('users/' + user.uid).set({
                        name: user.displayName,
                        email: user.email,
                        role: 'user',
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    });
                }
                
                window.location.href = 'user-dashboard.html';
            } catch (error) {
                console.error('Google login error:', error);
                const loginAlert = document.getElementById('loginAlert');
                loginAlert.style.display = 'block';
                loginAlert.className = 'alert alert-error';
                loginAlert.textContent = error.message;
            }
        }

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Check localStorage for offline data
                const localData = localStorage.getItem('userData');
                if (localData) {
                    const userData = JSON.parse(localData);
                    if (userData.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'user-dashboard.html';
                    }
                }
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateLanguage();
        });
    </script>
</body>
</html>
