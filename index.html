<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসাবের খাতা - লগইন ও রেজিষ্ট্রেশন</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite;
        }

        .bg-circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: 5s;
        }

        .bg-circle:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(0, -100px) scale(0.9); }
            75% { transform: translate(-50px, -50px) scale(1.05); }
        }

        /* Language Toggle */
        .lang-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 4px;
            border-radius: 25px;
            box-shadow: var(--shadow);
        }

        .lang-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-family: inherit;
            font-size: 14px;
            color: var(--gray);
        }

        .lang-btn:hover {
            color: var(--primary);
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow);
        }

        /* Auth Container */
        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 480px;
            margin: 80px 20px 20px 20px;
            padding: 40px;
            animation: slideUp 0.6s ease;
            position: relative;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 36px;
            animation: pulse 2s infinite;
            box-shadow: var(--shadow-lg);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .auth-header h1 {
            font-size: 28px;
            color: var(--dark);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .auth-header p {
            color: var(--gray);
            font-size: 16px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            color: var(--gray);
            transition: var(--transition);
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
            font-family: inherit;
            background: #f8fafc;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-group input:focus + i,
        .input-group input:focus ~ i {
            color: var(--primary);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray);
            transition: var(--transition);
            font-size: 18px;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--gray);
        }

        .checkbox-label input[type="checkbox"] {
            width: auto;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
        }

        .forgot-password:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--gray);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn.loading .spinner {
            display: inline-block;
        }

        .btn.loading .btn-text {
            display: none;
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Notification System */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            padding: 16px 20px;
            border-radius: 12px;
            background: white;
            box-shadow: var(--shadow-xl);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
            min-width: 300px;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .notification::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
        }

        .notification.success::before {
            background: var(--success);
        }

        .notification.error::before {
            background: var(--danger);
        }

        .notification.warning::before {
            background: var(--warning);
        }

        .notification.info::before {
            background: var(--primary);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .notification.slide-out {
            animation: slideOutRight 0.3s ease forwards;
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .notification.success .notification-icon {
            background: #d1fae5;
            color: var(--success);
        }

        .notification.error .notification-icon {
            background: #fee2e2;
            color: var(--danger);
        }

        .notification.warning .notification-icon {
            background: #fef3c7;
            color: var(--warning);
        }

        .notification.info .notification-icon {
            background: #dbeafe;
            color: var(--primary);
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 2px;
            font-size: 16px;
        }

        .notification-message {
            color: var(--gray);
            font-size: 14px;
        }

        .notification-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray);
            font-size: 18px;
            transition: var(--transition);
            padding: 5px;
        }

        .notification-close:hover {
            color: var(--danger);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .auth-container {
                margin: 70px 10px 10px 10px;
                padding: 30px 20px;
                max-height: calc(100vh - 80px);
            }

            .auth-header h1 {
                font-size: 24px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 14px;
            }

            .lang-toggle {
                top: 10px;
                right: 10px;
            }

            .lang-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .notification {
                min-width: auto;
                max-width: calc(100vw - 40px);
                margin: 0 20px;
            }

            .notification-container {
                top: 60px;
                right: 0;
                left: 0;
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 25px 15px;
            }

            .auth-logo {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <!-- Language Toggle -->
    <div class="lang-toggle">
        <button class="lang-btn active" id="bnBtn" onclick="setLanguage('bn')">
            <i class="fas fa-language"></i> বাংলা
        </button>
        <button class="lang-btn" id="enBtn" onclick="setLanguage('en')">
            <i class="fas fa-globe"></i> English
        </button>
    </div>

    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>

    <!-- Auth Container -->
    <div class="auth-container">
        <!-- Login Section -->
        <div id="loginSection">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-calculator"></i>
                </div>
                <h1 data-en="Accounting System" data-bn="হিসাবের খাতা">হিসাবের খাতা</h1>
                <p data-en="Sign in to your account" data-bn="আপনার অ্যাকাউন্টে সাইন ইন করুন">আপনার অ্যাকাউন্টে সাইন ইন করুন</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label data-en="Email Address" data-bn="ইমেইল ঠিকানা">ইমেইল ঠিকানা</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="example@email.com" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Password" data-bn="পাসওয়ার্ড">পাসওয়ার্ড</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span data-en="Remember me" data-bn="আমাকে মনে রাখুন">আমাকে মনে রাখুন</span>
                    </label>
                    <a href="#" class="forgot-password" onclick="showForgotPassword()" data-en="Forgot Password?" data-bn="পাসওয়ার্ড ভুলে গেছেন?">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">
                        <i class="fas fa-sign-in-alt"></i>
                        <span data-en="Login" data-bn="লগইন">লগইন</span>
                    </span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>
                    <span data-en="Don't have an account?" data-bn="অ্যাকাউন্ট নেই?">অ্যাকাউন্ট নেই?</span>
                    <a href="#" onclick="showRegister()" data-en="Register" data-bn="রেজিস্টার করুন">রেজিস্টার করুন</a>
                </p>
            </div>
        </div>

        <!-- Register Section -->
        <div id="registerSection" style="display: none;">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 data-en="Create Account" data-bn="নতুন অ্যাকাউন্ট">নতুন অ্যাকাউন্ট</h1>
                <p data-en="Register to get started" data-bn="রেজিস্টার করে শুরু করুন">রেজিস্টার করে শুরু করুন</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label data-en="Full Name" data-bn="সম্পূর্ণ নাম">সম্পূর্ণ নাম</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registerName" placeholder="আপনার নাম" required autocomplete="name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Business Name (Optional)" data-bn="ব্যবসার নাম (ঐচ্ছিক)">ব্যবসার নাম (ঐচ্ছিক)</label>
                    <div class="input-group">
                        <i class="fas fa-building"></i>
                        <input type="text" id="businessName" placeholder="ব্যবসার নাম" autocomplete="organization">
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Mobile Number" data-bn="মোবাইল নম্বর">মোবাইল নম্বর</label>
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="mobileNumber" placeholder="01XXXXXXXXX" required autocomplete="tel">
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Email Address" data-bn="ইমেইল ঠিকানা">ইমেইল ঠিকানা</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="registerEmail" placeholder="example@email.com" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Password" data-bn="পাসওয়ার্ড">পাসওয়ার্ড</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="কমপক্ষে ৬ অক্ষর" required autocomplete="new-password">
                        <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-en="Confirm Password" data-bn="পাসওয়ার্ড নিশ্চিত করুন">পাসওয়ার্ড নিশ্চিত করুন</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="পাসওয়ার্ড দিন" required autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="registerBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">
                        <i class="fas fa-user-plus"></i>
                        <span data-en="Register" data-bn="রেজিস্টার করুন">রেজিস্টার করুন</span>
                    </span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>
                    <span data-en="Already have an account?" data-bn="ইতিমধ্যে অ্যাকাউন্ট আছে?">ইতিমধ্যে অ্যাকাউন্ট আছে?</span>
                    <a href="#" onclick="showLogin()" data-en="Login" data-bn="লগইন করুন">লগইন করুন</a>
                </p>
            </div>
        </div>

        <!-- Forgot Password Section -->
        <div id="forgotPasswordSection" style="display: none;">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-key"></i>
                </div>
                <h1 data-en="Reset Password" data-bn="পাসওয়ার্ড রিসেট">পাসওয়ার্ড রিসেট</h1>
                <p data-en="Enter your email to receive reset link" data-bn="রিসেট লিংক পেতে ইমেইল দিন">রিসেট লিংক পেতে ইমেইল দিন</p>
            </div>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label data-en="Email Address" data-bn="ইমেইল ঠিকানা">ইমেইল ঠিকানা</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="forgotEmail" placeholder="example@email.com" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i>
                    <span data-en="Send Reset Link" data-bn="রিসেট লিংক পাঠান">রিসেট লিংক পাঠান</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>
                    <a href="#" onclick="showLogin()" data-en="Back to Login" data-bn="লগইনে ফিরে যান">লগইনে ফিরে যান</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB16ZrdZ2IY_R8aSZipz-O6SelEblngJLE",
            authDomain: "marketing-calculation.firebaseapp.com",
            databaseURL: "https://marketing-calculation-default-rtdb.firebaseio.com",
            projectId: "marketing-calculation",
            storageBucket: "marketing-calculation.firebasestorage.app",
            messagingSenderId: "371475369216",
            appId: "1:371475369216:web:3aff3d68b707f65c1e77e5",
            measurementId: "G-79164G85DX"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentLanguage = 'bn';

        // Language Functions
        function setLanguage(lang) {
            currentLanguage = lang;
            
            // Update button states
            document.getElementById('bnBtn').classList.toggle('active', lang === 'bn');
            document.getElementById('enBtn').classList.toggle('active', lang === 'en');
            
            // Update all text elements
            document.querySelectorAll('[data-en][data-bn]').forEach(element => {
                element.textContent = element.getAttribute(`data-${lang}`);
            });
            
            // Update placeholders
            updatePlaceholders(lang);
            
            // Save language preference
            localStorage.setItem('language', lang);
        }

        function updatePlaceholders(lang) {
            const placeholders = {
                loginEmail: lang === 'bn' ? 'example@email.com' : 'example@email.com',
                loginPassword: lang === 'bn' ? '••••••••' : '••••••••',
                registerName: lang === 'bn' ? 'আপনার নাম' : 'Your name',
                businessName: lang === 'bn' ? 'ব্যবসার নাম' : 'Business name',
                mobileNumber: lang === 'bn' ? '01XXXXXXXXX' : '01XXXXXXXXX',
                registerEmail: lang === 'bn' ? 'example@email.com' : 'example@email.com',
                registerPassword: lang === 'bn' ? 'কমপক্ষে ৬ অক্ষর' : 'At least 6 characters',
                confirmPassword: lang === 'bn' ? 'পাসওয়ার্ড দিন' : 'Enter password',
                forgotEmail: lang === 'bn' ? 'example@email.com' : 'example@email.com'
            };
            
            Object.keys(placeholders).forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.placeholder = placeholders[id];
                }
            });
        }

        // Show/Hide Sections
        function showLogin() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('forgotPasswordSection').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
            document.getElementById('forgotPasswordSection').style.display = 'none';
        }

        function showForgotPassword() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('forgotPasswordSection').style.display = 'block';
        }

        // Toggle Password Visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.password-toggle i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Notification System
        function showNotification(title, message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            
            notification.innerHTML = `
                <div class="notification-icon">
                    <i class="fas ${icons[type]}"></i>
                </div>
                <div class="notification-content">
                    <div class="notification-title">${title}</div>
                    <div class="notification-message">${message}</div>
                </div>
                <button class="notification-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            container.appendChild(notification);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.classList.add('slide-out');
                    setTimeout(() => {
                        notification.remove();
                    }, 300);
                }
            }, 5000);
        }

        // Error message mapping
        function getErrorMessage(error) {
            const errorMessages = {
                'auth/invalid-email': {
                    bn: { title: 'ভুল ইমেইল', message: 'আপনি একটি ভুল ইমেইল ঠিকানা দিয়েছেন' },
                    en: { title: 'Invalid Email', message: 'You entered an invalid email address' }
                },
                'auth/user-disabled': {
                    bn: { title: 'অ্যাকাউন্ট নিষ্ক্রিয়', message: 'আপনার অ্যাকাউন্ট নিষ্ক্রিয় করা হয়েছে' },
                    en: { title: 'Account Disabled', message: 'Your account has been disabled' }
                },
                'auth/user-not-found': {
                    bn: { title: 'ইউজার পাওয়া যায়নি', message: 'এই ইমেইল দিয়ে কোনো অ্যাকাউন্ট নেই' },
                    en: { title: 'User Not Found', message: 'No account found with this email' }
                },
                'auth/wrong-password': {
                    bn: { title: 'ভুল পাসওয়ার্ড', message: 'আপনি ভুল পাসওয়ার্ড দিয়েছেন' },
                    en: { title: 'Wrong Password', message: 'You entered an incorrect password' }
                },
                'auth/email-already-in-use': {
                    bn: { title: 'ইমেইল ব্যবহৃত', message: 'এই ইমেইল দিয়ে ইতিমধ্যে অ্যাকাউন্ট আছে' },
                    en: { title: 'Email Already Used', message: 'An account already exists with this email' }
                },
                'auth/weak-password': {
                    bn: { title: 'দুর্বল পাসওয়ার্ড', message: 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে' },
                    en: { title: 'Weak Password', message: 'Password must be at least 6 characters' }
                },
                'auth/network-request-failed': {
                    bn: { title: 'নেটওয়ার্ক সমস্যা', message: 'ইন্টারনেট সংযোগ পরীক্ষা করুন' },
                    en: { title: 'Network Error', message: 'Please check your internet connection' }
                },
                'auth/too-many-requests': {
                    bn: { title: 'অনেক চেষ্টা', message: 'অনেকবার চেষ্টা করেছেন, কিছুক্ষণ পর আবার চেষ্টা করুন' },
                    en: { title: 'Too Many Attempts', message: 'Too many attempts, please try again later' }
                }
            };
            
            const defaultError = {
                bn: { title: 'ত্রুটি', message: 'কিছু ভুল হয়েছে, আবার চেষ্টা করুন' },
                en: { title: 'Error', message: 'Something went wrong, please try again' }
            };
            
            const errorInfo = errorMessages[error.code] || defaultError;
            return errorInfo[currentLanguage] || errorInfo.bn;
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            
            // Show loading
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            
            try {
                // Set persistence
                if (rememberMe) {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                } else {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
                }
                
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Check user role from database
                const userSnapshot = await database.ref('users/' + user.uid).once('value');
                const userData = userSnapshot.val();
                
                if (!userData) {
                    throw new Error('User data not found');
                }
                
                // Update last login
                await database.ref('users/' + user.uid + '/lastLogin').set(firebase.database.ServerValue.TIMESTAMP);
                
                // Save to localStorage for offline
                localStorage.setItem('userData', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    name: userData.name || user.email.split('@')[0],
                    businessName: userData.businessName || '',
                    mobileNumber: userData.mobileNumber || '',
                    role: userData.role || 'user'
                }));
                
                // Show success notification
                showNotification(
                    currentLanguage === 'bn' ? 'সফল' : 'Success',
                    currentLanguage === 'bn' ? 'লগইন সফল হয়েছে!' : 'Login successful!',
                    'success'
                );
                
                // Redirect based on role
                setTimeout(() => {
                    if (userData.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'user-dashboard.html';
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                const errorInfo = getErrorMessage(error);
                showNotification(errorInfo.title, errorInfo.message, 'error');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const businessName = document.getElementById('businessName').value;
            const mobileNumber = document.getElementById('mobileNumber').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');
            
            // Validate passwords
            if (password !== confirmPassword) {
                showNotification(
                    currentLanguage === 'bn' ? 'পাসওয়ার্ড মিলছে না' : 'Password Mismatch',
                    currentLanguage === 'bn' ? 'দুটি পাসওয়ার্ড একই নয়' : 'The two passwords do not match',
                    'warning'
                );
                return;
            }
            
            if (password.length < 6) {
                showNotification(
                    currentLanguage === 'bn' ? 'দুর্বল পাসওয়ার্ড' : 'Weak Password',
                    currentLanguage === 'bn' ? 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে' : 'Password must be at least 6 characters',
                    'warning'
                );
                return;
            }
            
            // Validate mobile number
            if (!/^01[0-9]{9}$/.test(mobileNumber)) {
                showNotification(
                    currentLanguage === 'bn' ? 'ভুল মোবাইল নম্বর' : 'Invalid Mobile',
                    currentLanguage === 'bn' ? 'সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)' : 'Please enter a valid mobile number (01XXXXXXXXX)',
                    'warning'
                );
                return;
            }
            
            // Show loading
            registerBtn.classList.add('loading');
            registerBtn.disabled = true;
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Update user profile
                await user.updateProfile({
                    displayName: name
                });
                
                // Save user data to database
                const userData = {
                    name: name,
                    businessName: businessName || '',
                    mobileNumber: mobileNumber,
                    email: email,
                    role: 'user',
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    lastLogin: firebase.database.ServerValue.TIMESTAMP,
                    profilePic: '',
                    settings: {
                        currency: 'BDT',
                        language: currentLanguage,
                        theme: 'light'
                    }
                };
                
                await database.ref('users/' + user.uid).set(userData);
                
                // Save to localStorage
                localStorage.setItem('userData', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    name: name,
                    businessName: businessName,
                    mobileNumber: mobileNumber,
                    role: 'user'
                }));
                
                // Show success notification
                showNotification(
                    currentLanguage === 'bn' ? 'সফল' : 'Success',
                    currentLanguage === 'bn' ? 'রেজিষ্ট্রেশন সফল হয়েছে!' : 'Registration successful!',
                    'success'
                );
                
                // Redirect to login page
                setTimeout(() => {
                    showLogin();
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').focus();
                    
                    showNotification(
                        currentLanguage === 'bn' ? 'লগইন করুন' : 'Please Login',
                        currentLanguage === 'bn' ? 'এখন আপনার অ্যাকাউন্টে লগইন করুন' : 'Now login to your account',
                        'info'
                    );
                }, 1500);
                
            } catch (error) {
                console.error('Registration error:', error);
                const errorInfo = getErrorMessage(error);
                showNotification(errorInfo.title, errorInfo.message, 'error');
            } finally {
                registerBtn.classList.remove('loading');
                registerBtn.disabled = false;
            }
        });

        // Forgot Password
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('forgotEmail').value;
            
            try {
                await auth.sendPasswordResetEmail(email);
                showNotification(
                    currentLanguage === 'bn' ? 'ইমেইল পাঠানো হয়েছে' : 'Email Sent',
                    currentLanguage === 'bn' ? 'পাসওয়ার্ড রিসেট লিংক আপনার ইমেইলে পাঠানো হয়েছে' : 'Password reset link sent to your email',
                    'success'
                );
                
                setTimeout(() => {
                    showLogin();
                }, 2000);
                
            } catch (error) {
                console.error('Forgot password error:', error);
                const errorInfo = getErrorMessage(error);
                showNotification(errorInfo.title, errorInfo.message, 'error');
            }
        });

        // Check if user is already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    // Check user role from database
                    const userSnapshot = await database.ref('users/' + user.uid).once('value');
                    const userData = userSnapshot.val();
                    
                    if (userData && userData.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'user-dashboard.html';
                    }
                } catch (error) {
                    console.error('Error checking user:', error);
                    // If offline, use localStorage
                    const localData = localStorage.getItem('userData');
                    if (localData) {
                        const userData = JSON.parse(localData);
                        if (userData.role === 'admin') {
                            window.location.href = 'admin-dashboard.html';
                        } else {
                            window.location.href = 'user-dashboard.html';
                        }
                    }
                }
            }
        });

        // Online/Offline detection
        database.ref('.info/connected').on('value', (snapshot) => {
            const isOnline = snapshot.val();
            
            if (isOnline) {
                // Online - sync data from localStorage to database
                const localData = localStorage.getItem('userData');
                if (localData) {
                    const userData = JSON.parse(localData);
                    if (userData.uid) {
                        database.ref('users/' + userData.uid + '/lastLogin').set(firebase.database.ServerValue.TIMESTAMP);
                    }
                }
                
                // Clear localStorage after sync
                localStorage.removeItem('transactions');
            } else {
                // Offline - show notification
                showNotification(
                    currentLanguage === 'bn' ? 'অফলাইন' : 'Offline',
                    currentLanguage === 'bn' ? 'আপনি এখন অফলাইনে আছেন' : 'You are now offline',
                    'warning'
                );
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Load saved language
            const savedLang = localStorage.getItem('language') || 'bn';
            setLanguage(savedLang);
            
            // Check for offline data
            const localData = localStorage.getItem('userData');
            if (localData) {
                const userData = JSON.parse(localData);
                if (userData.email) {
                    document.getElementById('loginEmail').value = userData.email;
                    document.getElementById('rememberMe').checked = true;
                }
            }
        });
    </script>
</body>
</html>
