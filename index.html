<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসাবের খাতা - হোম</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .home-logo {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 10px;
        }
        h1 { font-size: 28px; color: #1e293b; margin-bottom: 5px; }
        p { color: #64748b; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
            transition: 0.3s;
            color: white;
        }
        .btn-login { background: #6366f1; }
        .btn-login:hover { background: #4f46e5; transform: translateY(-2px); }
        .btn-register { background: #10b981; }
        .btn-register:hover { background: #059669; transform: translateY(-2px); }
        .footer { margin-top: 20px; font-size: 14px; color: #94a3b8; }
        @media (max-width: 480px) { .home-container { padding: 30px 20px; } }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="home-logo"><i class="fas fa-store-alt"></i></div>
        <h1>হিসাবের খাতা</h1>
        <p>আপনার ব্যবসার হিসাব রাখুন সহজে</p>
        <a href="login.html" class="btn btn-login"><i class="fas fa-sign-in-alt"></i> লগইন করুন</a>
        <a href="register.html" class="btn btn-register"><i class="fas fa-user-plus"></i> রেজিস্টার করুন</a>
        <div class="footer">© 2025 হিসাবের খাতা</div>
    </div>
</body>
</html>
